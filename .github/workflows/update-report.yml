name: Auto-Update Solana Ecosystem Telemetry & Deploy

on:
  schedule:
    - cron: '0 */6 * * *' # Run every 6 hours
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Telemetry Collector & Report Generator
        run: |
          python main.py

      - name: Commit & Push Updated Telemetry
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/ index.html
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(telemetry): auto-refresh Solana ecosystem intelligence" && git push origin main)
